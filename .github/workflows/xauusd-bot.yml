name: XAUUSD Bot v28.0 — Unified Pipeline

# ═════════════════════════════════════════════════════════════════
# TRIGGERS
# - schedule: setiap 15 menit (bot + health check + failure notify)
# - workflow_dispatch: manual dengan mode (auto / dry-run / emergency-stop)
# ═════════════════════════════════════════════════════════════════
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: 'Execution mode'
        options:
          - auto            # bot normal
          - dry-run         # tidak kirim Telegram, tidak tulis state
          - emergency-stop  # aktifkan kill switch + freeze state
        default: auto

# ═════════════════════════════════════════════════════════════════
# CONCURRENCY — emergency-stop pakai group terpisah
# agar TIDAK antre di belakang bot yang sedang berjalan.
# ═════════════════════════════════════════════════════════════════
concurrency:
  group: xauusd-bot-${{ github.event.inputs.mode == 'emergency-stop' && 'emergency' || 'state' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write    # untuk `gh run cancel` di emergency-stop

env:
  PYTHONUNBUFFERED: '1'
  TZ: 'UTC'

jobs:
  pipeline:
    name: Run (${{ github.event.inputs.mode || 'scheduled' }})
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_GIST_TOKEN:    ${{ secrets.GH_GIST_TOKEN }}
      GH_GIST_ID:       ${{ secrets.GH_GIST_ID }}
      TWELVE_DATA_KEY:  ${{ secrets.TWELVE_DATA_KEY }}
      ACCOUNT_EQUITY:   ${{ vars.ACCOUNT_EQUITY || '1000' }}
      RISK_PERCENT:     ${{ vars.RISK_PERCENT   || '1.0' }}
      KILL_SWITCH:      ${{ vars.KILL_SWITCH    || 'false' }}

    steps:
      # ═════════════════════════════════════════════════════════
      # PATH A — EMERGENCY STOP (hanya jika mode == 'emergency-stop')
      # ═════════════════════════════════════════════════════════
      - name: "[EMERGENCY] 1. Activate kill switch"
        if: github.event.inputs.mode == 'emergency-stop'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ADMIN }}
        run: |
          gh api -X PATCH \
            "repos/${{ github.repository }}/actions/variables/KILL_SWITCH" \
            -f name=KILL_SWITCH -f value=true 2>/dev/null || \
          gh api -X POST \
            "repos/${{ github.repository }}/actions/variables" \
            -f name=KILL_SWITCH -f value=true
          echo "✅ KILL_SWITCH=true"

      - name: "[EMERGENCY] 2. Freeze Gist state"
        if: github.event.inputs.mode == 'emergency-stop'
        continue-on-error: true
        run: |
          python - <<'PY'
          import os, json, requests
          gid, tok = os.environ.get("GH_GIST_ID"), os.environ.get("GH_GIST_TOKEN")
          if not (gid and tok):
              print("⚠️ Gist not configured, skip freeze"); raise SystemExit(0)
          r = requests.get(f"https://api.github.com/gists/{gid}",
                           headers={"Authorization": f"token {tok}"}, timeout=15)
          for fn, fc in r.json().get("files", {}).items():
              if fn.endswith("bot_state.json"):
                  s = json.loads(fc["content"])
                  s["kill_switch"] = True
                  requests.patch(f"https://api.github.com/gists/{gid}",
                      json={"files": {fn: {"content": json.dumps(s, indent=2)}}},
                      headers={"Authorization": f"token {tok}"}, timeout=15)
                  print(f"✅ Gist state frozen: {fn}")
          PY

      - name: "[EMERGENCY] 3. Cancel in-flight bot runs"
        if: github.event.inputs.mode == 'emergency-stop'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list --workflow="${{ github.workflow }}" --status=in_progress \
            --json databaseId --jq '.[].databaseId' \
            | grep -v "^${{ github.run_id }}$" \
            | xargs -r -I{} gh run cancel {} || true
          echo "✅ In-flight runs cancelled (kecuali run ini)"

      - name: "[EMERGENCY] 4. Notify Telegram"
        if: always() && github.event.inputs.mode == 'emergency-stop'
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" -d parse_mode=HTML \
            --data-urlencode "text=🛑 <b>EMERGENCY STOP ACTIVATED</b>
          Time: $(date -u +%FT%TZ)
          Repo: ${{ github.repository }}
          Reaktivasi: hapus variable <code>KILL_SWITCH</code>" || true

      # ═════════════════════════════════════════════════════════
      # PATH B — BOT (auto / dry-run / schedule)
      # ═════════════════════════════════════════════════════════
      - name: "Checkout"
        if: github.event.inputs.mode != 'emergency-stop'
        uses: actions/checkout@v4

      - name: "Setup Python + pip cache"
        if: github.event.inputs.mode != 'emergency-stop'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: "Install dependencies"
        if: github.event.inputs.mode != 'emergency-stop'
        run: pip install -r requirements.txt

      - name: "Pre-run health check (watchdog)"
        if: github.event.inputs.mode != 'emergency-stop'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST=$(gh run list --workflow="${{ github.workflow }}" --status=success \
                 --limit=1 --json createdAt --jq '.[0].createdAt // "never"')
          echo "📊 Last success: $LAST"
          if [ "$LAST" != "never" ] && [ -n "$LAST" ]; then
            AGE=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 60 ))
            echo "⏱ Age: ${AGE}m"
            if [ "$AGE" -gt 45 ]; then
              curl -sS -X POST \
                "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
                -d chat_id="${TELEGRAM_CHAT_ID}" -d parse_mode=HTML \
                --data-urlencode "text=⚠️ <b>Bot STALE</b> (${AGE}m sejak success terakhir)" || true
            fi
          fi

      - name: "Kill switch guard"
        if: github.event.inputs.mode != 'emergency-stop' && vars.KILL_SWITCH == 'true'
        run: |
          echo "⛔ KILL_SWITCH=true — bot execution skipped."

      - name: "Run bot"
        id: bot
        if: github.event.inputs.mode != 'emergency-stop' && vars.KILL_SWITCH != 'true'
        env:
          BACKTEST_MODE: ${{ github.event.inputs.mode == 'dry-run' && 'true' || 'false' }}
        run: |
          python main.py 2>&1 | tee bot.log
          EXIT=${PIPESTATUS[0]}
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          exit $EXIT

      - name: "Upload logs"
        if: always() && github.event.inputs.mode != 'emergency-stop'
        uses: actions/upload-artifact@v4
        with:
          name: bot-log-${{ github.run_id }}
          path: bot.log
          retention-days: 14
          if-no-files-found: warn

      - name: "Notify failure"
        if: failure() && github.event.inputs.mode != 'emergency-stop'
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" -d parse_mode=HTML \
            --data-urlencode "text=🚨 <b>BOT FAILED</b>
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true

      - name: "Summary"
        if: always()
        run: |
          echo "### 🚀 XAUUSD Pipeline Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Mode | \`${{ github.event.inputs.mode || 'scheduled' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Kill switch | \`${{ vars.KILL_SWITCH }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Bot exit | \`${{ steps.bot.outputs.exit_code || 'skipped' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f bot.log ]; then
            echo "**Log tail:**" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 30 bot.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
