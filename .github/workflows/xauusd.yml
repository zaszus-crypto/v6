name: XAUUSD Bot v29.0 — Perfect Redundancy

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: 'Execution mode'
        options: [auto, dry-run, emergency-stop]
        default: auto

concurrency:
  group: xauusd-bot-${{ github.event.inputs.mode == 'emergency-stop' && 'emergency' || 'state' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      PYTHONUNBUFFERED: '1'
      TZ: 'UTC'
      TELEGRAM_TOKEN:     ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_GIST_TOKEN:      ${{ secrets.GH_GIST_TOKEN }}
      GH_GIST_ID:         ${{ secrets.GH_GIST_ID }}
      TWELVE_DATA_KEY:    ${{ secrets.TWELVE_DATA_KEY }}
      TWELVE_DATA_KEY_2:  ${{ secrets.TWELVE_DATA_KEY_2 }}
      GOLD_API_KEY:       ${{ secrets.GOLD_API_KEY }}
      OANDA_API_KEY:      ${{ secrets.OANDA_API_KEY }}
      ACCOUNT_EQUITY:     ${{ vars.ACCOUNT_EQUITY || '1000' }}
      RISK_PERCENT:       ${{ vars.RISK_PERCENT   || '1.0' }}
      KILL_SWITCH:        ${{ vars.KILL_SWITCH    || 'false' }}

    steps:
      - name: "[EMERGENCY] Activate kill switch"
        if: github.event.inputs.mode == 'emergency-stop'
        continue-on-error: true
        env: { GH_TOKEN: '${{ secrets.GH_PAT_ADMIN }}' }
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/actions/variables/KILL_SWITCH" -f name=KILL_SWITCH -f value=true 2>/dev/null || \
          gh api -X POST "repos/${{ github.repository }}/actions/variables" -f name=KILL_SWITCH -f value=true

      - uses: actions/checkout@v4
        if: github.event.inputs.mode != 'emergency-stop'

      - uses: actions/setup-python@v5
        if: github.event.inputs.mode != 'emergency-stop'
        with: { python-version: '3.11', cache: 'pip' }

      - name: Install deps
        if: github.event.inputs.mode != 'emergency-stop'
        run: pip install -r requirements.txt

      - name: Run bot
        if: github.event.inputs.mode != 'emergency-stop' && vars.KILL_SWITCH != 'true'
        env:
          BACKTEST_MODE: ${{ github.event.inputs.mode == 'dry-run' && 'true' || 'false' }}
        run: |
          python xauusd.py 2>&1 | tee bot.log
          exit ${PIPESTATUS[0]}

      - uses: actions/upload-artifact@v4
        if: always() && github.event.inputs.mode != 'emergency-stop'
        with: { name: bot-log, path: bot.log, retention-days: 14 }
