name: XAUUSD Bot v27

on:
  schedule:
    - cron: '0,15,30,45 * * * *'
  workflow_dispatch:

concurrency:
  group: xauusd-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_GIST_TOKEN:    ${{ secrets.GH_GIST_TOKEN }}
          GH_GIST_ID:       ${{ secrets.GH_GIST_ID }}
          TWELVE_DATA_KEY:  ${{ secrets.TWELVE_DATA_KEY }}
          ACCOUNT_EQUITY:   ${{ secrets.ACCOUNT_EQUITY }}
          RISK_PERCENT:     ${{ secrets.RISK_PERCENT }}
          KILL_SWITCH:      ${{ secrets.KILL_SWITCH }}
        run: python main.py
