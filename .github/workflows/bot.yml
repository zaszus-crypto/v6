name: xauusd-bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: xauusd-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        timeout-minutes: 4
        run: python bot.py
        env:
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_GIST_TOKEN:     ${{ secrets.GH_GIST_TOKEN }}
          GH_GIST_ID:        ${{ secrets.GH_GIST_ID }}
          TWELVE_DATA_KEY:   ${{ secrets.TWELVE_DATA_KEY }}
          TWELVE_DATA_KEY_2: ${{ secrets.TWELVE_DATA_KEY_2 }}
          OANDA_API_KEY:     ${{ secrets.OANDA_API_KEY }}
          GOLD_API_KEY:      ${{ secrets.GOLD_API_KEY }}
          ACCOUNT_EQUITY:    "1000"
          RISK_PERCENT:      "1.0"
          BACKTEST_MODE:     "false"

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-log-${{ github.run_id }}
          path: ~/.xauusd_audit.jsonl
          retention-days: 7
          if-no-files-found: ignore
